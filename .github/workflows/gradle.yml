# This workflow will build a Java project with Gradle and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-gradle

name: Java CI with Gradle 

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  CI-CD:
    runs-on: ubuntu-latest  # 깃허브 런타임에서 빌드해야해서 이때 우분투 쓰겠다는 뜻

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4  # 이건 바꾸면 안된다

      - name: Docker build & Docker Hub push
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
          docker build -t "${{ secrets.DOCKER_USERNAME }}/eureka:${{ github.run_number }}" .  # 변수화해도 됨, 매번 다른 번호를 쓰기 위해 버전
          docker push "${{ secrets.DOCKER_USERNAME }}/eureka:${{ github.run_number }}"

      - name: Deploy to prod
        uses: appleboy/ssh-action@v1.2.0  # ssh 접속하기 위한 거
        with:
          host: ${{ secrets.HOST_EC2 }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}  # 이게 ec2 만들때 생긴 pem키
          script: |
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/eureka:${{ github.run_number }}
            sudo docker rm -f eureka || true
            sudo docker run -d --name eureka -p 8761:8761 --network spharos ${{ secrets.DOCKER_USERNAME }}/eureka:${{ github.run_number }}

      - name: Deploy to prod
        uses: appleboy/ssh-action@v1.2.0  //ssh 접속하기 위한 거
        with:
          host: ${{ secrets.HOST_EC2 }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }} //이게 ec2 만들떄 생긴 pem키
          script: |
            echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "{{ secrets.DOCKER_USERNAME }}" --password-stdin //권한
            sudo docker pull "${{ secrets.DOCKER_USERNAME }}/eureka:${{ github.run_number }}"
            sudo docker stop eureka || true //이미 유레카라는 게 띄워져있으면 스탑하겟다
            sudo docker rm eureka || true //스탑한 도커 지우겠다.
            sudo docker run -d \      //여긴 그냥 런하기 위해 썼던 거 똑같이 쓴거임
              --name eureka \
              --network spharos \
              -p 8761:8761 \
              "${{ secrets.DOCKER_USERNAME }}/eureka:${{ github.run_number }}"
            sudo docker image prune -a -f //이미지가 쌓이니간 안쓰는건 삭제하라는 명령
